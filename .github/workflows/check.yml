name: Pull request checks
on:
  pull_request:
    branches: [main, dev, nightly]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python3 -m py_compile scripts/build_trains.py scripts/verify_blend.py
